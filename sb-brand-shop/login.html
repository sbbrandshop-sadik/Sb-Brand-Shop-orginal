<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - SB BRAND SHOP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-wrapper { max-width: 420px; margin: 30px auto; padding: 20px; }
        .auth-box { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .auth-logo { text-align: center; font-size: 20px; font-weight: bold; color: #006643; margin-bottom: 20px; }
        .auth-tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .auth-tab { flex: 1; padding: 12px; text-align: center; font-weight: bold; font-size: 15px; cursor: pointer; color: #999; border: none; background: none; }
        .auth-tab.active { color: #006643; border-bottom: 3px solid #006643; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 12px 15px; border: 1.5px solid #ddd;
            border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s;
        }
        .form-group input:focus { border-color: #006643; }
        .submit-btn {
            width: 100%; padding: 14px; background: #006643; color: white;
            border: none; border-radius: 10px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.2s; margin-top: 5px;
        }
        .submit-btn:hover { background: #004d33; }
        .submit-btn:disabled { background: #aaa; cursor: not-allowed; }
        .error-msg { color: #d9534f; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }
        .back-link { display: block; text-align: center; margin-top: 18px; color: #006643; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <header class="top-header">
        <div class="logo">SB BRAND SHOP</div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-logo">👤 আপনার অ্যাকাউন্ট</div>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">লগইন</button>
                <button class="auth-tab" onclick="switchTab('register')">রেজিস্ট্রেশন</button>
            </div>

            <!-- LOGIN -->
            <div class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label>ইমেইল</label>
                    <input type="email" id="loginEmail" placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>পাসওয়ার্ড</label>
                    <input type="password" id="loginPassword" placeholder="আপনার পাসওয়ার্ড">
                </div>
                <button class="submit-btn" id="loginBtn">লগইন করুন</button>
                <p class="error-msg" id="loginError"></p>
            </div>

            <!-- REGISTER -->
            <div class="auth-form" id="registerForm">
                <div class="form-group">
                    <label>পূর্ণ নাম</label>
                    <input type="text" id="regName" placeholder="আপনার নাম">
                </div>
                <div class="form-group">
                    <label>ফোন নম্বর</label>
                    <input type="tel" id="regPhone" placeholder="01XXXXXXXXX">
                </div>
                <div class="form-group">
                    <label>ইমেইল</label>
                    <input type="email" id="regEmail" placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
                    <input type="password" id="regPassword" placeholder="••••••">
                </div>
                <button class="submit-btn" id="registerBtn">রেজিস্ট্রেশন করুন</button>
                <p class="error-msg" id="registerError"></p>
            </div>
        </div>
        <a href="index.html" class="back-link">← হোমে ফিরে যান</a>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { doc, setDoc }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // আগে থেকে লগইন থাকলে redirect
        onAuthStateChanged(auth, user => {
            if (user) window.location.href = 'index.html';
        });

        // Tab switch
        window.switchTab = function(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        };

        // LOGIN
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const err = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            err.textContent = '';

            if (!email || !password) { err.textContent = 'সব তথ্য পূরণ করুন'; return; }
            btn.disabled = true;
            btn.textContent = 'লোড হচ্ছে...';
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'index.html';
            } catch(e) {
                err.textContent = 'ইমেইল বা পাসওয়ার্ড ভুল';
                btn.disabled = false;
                btn.textContent = 'লগইন করুন';
            }
        });

        // REGISTER
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const err = document.getElementById('registerError');
            const btn = document.getElementById('registerBtn');
            err.textContent = '';

            if (!name || !phone || !email || !password) { err.textContent = 'সব তথ্য পূরণ করুন'; return; }
            if (password.length < 6) { err.textContent = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে'; return; }

            btn.disabled = true;
            btn.textContent = 'লোড হচ্ছে...';
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(cred.user, { displayName: name });
                await setDoc(doc(db, 'users', cred.user.uid), {
                    name, phone, email, role: 'user', createdAt: new Date()
                });
                window.location.href = 'index.html';
            } catch(e) {
                if (e.code === 'auth/email-already-in-use') err.textContent = 'এই ইমেইল আগেই registered';
                else err.textContent = 'রেজিস্ট্রেশন ব্যর্থ হয়েছে';
                btn.disabled = false;
                btn.textContent = 'রেজিস্ট্রেশন করুন';
            }
        });
    </script>
</body>
</html>

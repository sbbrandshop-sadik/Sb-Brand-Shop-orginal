<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল - SB BRAND SHOP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-page { padding: 15px; max-width: 600px; margin: 0 auto; }
        .profile-card { background: white; border-radius: 16px; padding: 25px; text-align: center; margin-bottom: 20px; box-shadow: 0 3px 12px rgba(0,0,0,0.07); }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: #006643; color: white; font-size: 36px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
        .user-name { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
        .user-email { color: #999; font-size: 14px; }
        .action-btns { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .admin-link { background: #006643; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .logout-btn { background: #d9534f; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .logout-btn:hover { background: #b52b27; }

        .order-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .order-id { font-size: 12px; color: #aaa; font-family: monospace; }
        .order-date { font-size: 12px; color: #aaa; }
        .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .s-pending { background: #fff3cd; color: #856404; }
        .s-processing { background: #cfe2ff; color: #084298; }
        .s-delivered { background: #d1e7dd; color: #0a3622; }
        .s-cancelled { background: #f8d7da; color: #842029; }
        .order-items-list { font-size: 13px; color: #666; margin-bottom: 6px; }
        .order-total { font-size: 15px; font-weight: bold; color: #006643; }

        .not-logged { text-align: center; padding: 60px 20px; }
        .not-logged i { font-size: 65px; color: #ddd; display: block; margin-bottom: 15px; }
        .not-logged p { color: #999; margin-bottom: 20px; font-size: 16px; }
        .login-btn { display: inline-block; background: #006643; color: white; padding: 13px 30px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <header class="top-header">
        <div class="logo">👤 আমার প্রোফাইল</div>
    </header>

    <div class="profile-page" id="profilePage">
        <div style="text-align:center;padding:50px;color:#999;">লোড হচ্ছে...</div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-clapperboard"></i><span>Reels</span></a>
        <a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a>
        <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>Profile</span></a>
    </nav>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { collection, query, where, getDocs, orderBy }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { onAuthStateChanged, signOut }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // ⚠️ এখানে আপনার admin email দিন
        const ADMIN_EMAIL = 'sadikul.pcml@gmail.com';

        const statusMap = {
            pending:    { label: '⏳ অপেক্ষমান',        cls: 's-pending' },
            processing: { label: '🔄 প্রক্রিয়াধীন',     cls: 's-processing' },
            delivered:  { label: '✅ ডেলিভারি হয়েছে',   cls: 's-delivered' },
            cancelled:  { label: '❌ বাতিল',             cls: 's-cancelled' }
        };

        onAuthStateChanged(auth, async (user) => {
            const page = document.getElementById('profilePage');

            if (!user) {
                page.innerHTML = `
                    <div class="not-logged">
                        <i class="fa-solid fa-user-slash"></i>
                        <p>আপনি এখনো লগইন করেননি</p>
                        <a href="login.html" class="login-btn">লগইন / রেজিস্ট্রেশন করুন</a>
                    </div>`;
                return;
            }

            // Load orders
            let ordersHTML = '';
            try {
                const snap = await getDocs(
                    query(collection(db, 'orders'), where('userId', '==', user.uid))
                );
                if (snap.empty) {
                    ordersHTML = '<p style="text-align:center;color:#aaa;padding:20px;">এখনো কোনো অর্ডার নেই</p>';
                } else {
                    const orders = [];
                    snap.forEach(d => orders.push({ id: d.id, ...d.data() }));
                    orders.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    orders.forEach(o => {
                        const st = statusMap[o.status] || statusMap.pending;
                        const items = o.items.map(i => `${i.name} ×${i.quantity}`).join(', ');
                        const date = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleDateString('bn-BD') : '';
                        ordersHTML += `
                        <div class="order-card">
                            <div class="order-top">
                                <span class="order-id">#${o.id.substring(0,8).toUpperCase()}</span>
                                <span class="status-badge ${st.cls}">${st.label}</span>
                            </div>
                            <div class="order-items-list">${items}</div>
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <span class="order-total">৳${o.total}</span>
                                <span class="order-date">${date}</span>
                            </div>
                        </div>`;
                    });
                }
            } catch(e) {
                ordersHTML = '<p style="text-align:center;color:#aaa;padding:20px;">অর্ডার লোড হয়নি</p>';
            }

            page.innerHTML = `
                <div class="profile-card">
                    <div class="avatar">${(user.displayName || 'U')[0].toUpperCase()}</div>
                    <div class="user-name">${user.displayName || 'ব্যবহারকারী'}</div>
                    <div class="user-email">${user.email}</div>
                    <div class="action-btns">
                        ${user.email === ADMIN_EMAIL ? `<a href="admin.html" class="admin-link"><i class="fa-solid fa-screwdriver-wrench"></i> Admin Panel</a>` : ''}
                        <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>
                    </div>
                </div>
                <h2 class="section-title">আমার অর্ডার সমূহ</h2>
                ${ordersHTML}`;

            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await signOut(auth);
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
